<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>秀朗校請假申請</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans TC", "Microsoft JhengHei", Arial, sans-serif;
      background: #f4f7fb;
      color: #333;
    }

    .page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 16px;
      box-sizing: border-box;
    }

    .card {
      width: 100%;
      max-width: 520px;
      background: #fff;
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      box-sizing: border-box;
    }

    h1 {
      margin: 0;
      text-align: center;
      color: #1f5fa8;
      font-size: 26px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin: 10px 0 20px;
      line-height: 1.6;
    }

    .privacy-note {
      background: #f0f6ff;
      color: #395f8c;
      font-size: 13px;
      line-height: 1.6;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 700;
      margin: 18px 0 8px;
      font-size: 16px;
    }

    input, textarea, select {
      width: 100%;
      box-sizing: border-box;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #d8dee9;
      border-radius: 12px;
      outline: none;
      background: #fff;
      font-family: inherit;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #1f5fa8;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .options {
      display: grid;
      gap: 10px;
    }

    .three {
      grid-template-columns: 1fr;
    }

    .two {
      grid-template-columns: 1fr;
    }

    @media (min-width: 520px) {
      .three {
        grid-template-columns: repeat(3, 1fr);
      }

      .two {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .option {
      display: block;
    }

    .option input {
      display: none;
    }

    .option span {
      display: block;
      text-align: center;
      padding: 14px 10px;
      border: 1px solid #d8dee9;
      border-radius: 12px;
      background: #fff;
      cursor: pointer;
      font-size: 16px;
      line-height: 1.4;
    }

    .option input:checked + span {
      background: #1f5fa8;
      color: #fff;
      border-color: #1f5fa8;
      font-weight: 700;
    }

    .hidden {
      display: none;
    }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 16px;
      border: none;
      border-radius: 14px;
      background: #1f5fa8;
      color: #fff;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    button:disabled {
      background: #9aa9bd;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      text-align: center;
      font-weight: 700;
      line-height: 1.6;
      min-height: 24px;
    }

    .message.error {
      color: #c0392b;
    }

    .message.sending {
      color: #395f8c;
    }

    .hint {
      font-size: 13px;
      color: #777;
      margin-top: 6px;
      line-height: 1.5;
    }

    .note {
      margin-top: 18px;
      font-size: 13px;
      color: #777;
      line-height: 1.6;
      text-align: center;
    }

    .section-box {
      margin-top: 14px;
      padding: 14px;
      background: #fafbfd;
      border: 1px solid #e5e9f0;
      border-radius: 14px;
    }

    .section-title {
      font-weight: 700;
      margin-bottom: 6px;
      color: #333;
    }

    .section-desc {
      font-size: 13px;
      color: #777;
      line-height: 1.5;
      margin-bottom: 12px;
    }

    .success-screen {
      text-align: center;
      padding: 18px 4px;
    }

    .success-icon {
      font-size: 56px;
      margin-bottom: 12px;
    }

    .success-title {
      font-size: 24px;
      font-weight: 800;
      color: #16834a;
      margin-bottom: 10px;
    }

    .success-text {
      color: #555;
      line-height: 1.8;
      font-size: 16px;
      margin-bottom: 16px;
    }

    .success-reminder {
      background: #f0f6ff;
      color: #395f8c;
      font-size: 14px;
      line-height: 1.7;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    iframe {
      display: none;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="card">

      <div id="formScreen">
        <h1>秀朗校請假申請</h1>

        <div class="subtitle">
          請填寫以下資料，送出後老師會協助登記。
        </div>

        <div class="privacy-note">
          本表單僅供請假登記與學生照顧使用，資料不作其他用途。
        </div>

        <form id="leaveForm" method="POST" target="gasFrame">
          <input type="hidden" id="classType" name="classType" value="">
          <input type="hidden" id="healthStatus" name="healthStatus" value="">
          <input type="hidden" id="clientToken" name="clientToken" value="">

          <label>學生姓名</label>

          <input
            type="text"
            id="studentName"
            name="studentName"
            placeholder="中文全名，例如：王小明"
            required
            pattern="^[\u4e00-\u9fa5]{2,5}$"
            title="請填寫學生中文全名，例如：王小明"
          >
          <div class="hint">請填寫孩子的中文全名，方便老師比對學生名單。</div>

          <input
            type="text"
            id="englishName"
            name="englishName"
            placeholder="英文名，選填，例如：Jason"
            pattern="^[A-Za-z][A-Za-z .'\-]{0,29}$"
            title="英文名為選填，例如 Amy、Jason、Anne"
            style="margin-top: 10px;"
          >
          <div class="hint">英文名可填可不填，不知道可留空。</div>

          <label for="parentClass">班級</label>
          <input
            type="text"
            id="parentClass"
            name="parentClass"
            placeholder="選填，例如：OO老師班"
          >
          <div class="hint">班級可填可不填，不知道可留空。</div>

          <label for="leaveDate">請假日期</label>
          <input
            type="text"
            id="leaveDate"
            name="leaveDate"
            placeholder="請選擇一個或多個日期"
            required
            readonly
          >
          <div class="hint">可一次選擇多個日期，日期有變色才有選到。</div>

          <label>請假班別</label>
          <div class="options three">
            <label class="option">
              <input type="checkbox" class="class-checkbox" value="課輔">
              <span>課輔</span>
            </label>

            <label class="option">
              <input type="checkbox" class="class-checkbox" value="英文">
              <span>英文</span>
            </label>

            <label class="option">
              <input type="checkbox" class="class-checkbox" value="才藝">
              <span>才藝</span>
            </label>
          </div>
          <div class="hint">可複選。</div>

          <label>請假原因</label>
          <div class="options three">
            <label class="option">
              <input type="radio" name="reason" value="病假" required>
              <span>病假</span>
            </label>

            <label class="option">
              <input type="radio" name="reason" value="事假">
              <span>事假</span>
            </label>

            <label class="option">
              <input type="radio" name="reason" value="其他">
              <span>其他</span>
            </label>
          </div>

          <div id="healthBox" class="section-box hidden">
            <div class="section-title">身體狀況</div>
            <div class="section-desc">
              可複選；若方便填寫，請協助老師掌握照顧與班級健康狀況。
            </div>

            <div class="options two">
              <label class="option"><input type="checkbox" class="health-checkbox" value="發燒"><span>發燒</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="嘔吐"><span>嘔吐</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="拉肚子"><span>拉肚子</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="生理期"><span>生理期</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="諾羅"><span>諾羅</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="感冒"><span>感冒</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="流感"><span>流感</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="腸病毒"><span>腸病毒</span></label>
              <label class="option"><input type="checkbox" class="health-checkbox" value="水痘"><span>水痘</span></label>
            </div>
          </div>

          <div id="otherReasonBox" class="hidden">
            <label for="otherReason">其他原因</label>
            <input
              type="text"
              id="otherReason"
              name="otherReason"
              placeholder="可補充說明"
            >
          </div>

          <label for="note">備註</label>
          <textarea
            id="note"
            name="note"
            placeholder="可補充說明，例如：晚點接、已看醫生、需請老師協助轉達等"
          ></textarea>

          <button type="submit" id="submitBtn">送出請假申請</button>

          <div id="message" class="message"></div>

          <div class="note">
            若有緊急狀況，請另行與校方聯繫。
          </div>
        </form>
      </div>

      <div id="successScreen" class="success-screen hidden">
        <div class="success-icon">✅</div>

        <div class="success-title">請假申請已送出</div>

        <div class="success-text">
          系統已收到請假資料，<br>
          會協助登記與後續處理。
        </div>

        <div class="success-reminder">
          如有臨時接送、緊急狀況或需立即聯繫老師，<br>
          請電話通知校方。
        </div>

        <button type="button" onclick="backToForm()">填寫下一筆請假</button>
      </div>

    </div>
  </div>

  <iframe id="gasFrame" name="gasFrame"></iframe>

  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/zh-tw.js"></script>

  <script>
// 替換原 HTML 最後一段 inline <script> 的內容；外部 flatpickr script 保留。
// 沿用秀朗原部署網址；先更新原後端部署，再替換本頁。
const GAS_URL = 'https://script.google.com/macros/s/AKfycbzDoCk44Tnm3TDfZxVJRjXe-fRqW_Huey1uA4xWFHkJkcqnTLDwdwYCdU8LGKG2QkyI/exec';
const datePicker = flatpickr('#leaveDate',{mode:'multiple',dateFormat:'Y-m-d',locale:'zh_tw',conjunction:'、',minDate:'today'});
const form = document.getElementById('leaveForm');
const submitBtn = document.getElementById('submitBtn');
const message = document.getElementById('message');
const keys = ['studentName','englishName','parentClass','leaveDate','classType','reason','healthStatus','otherReason','note'];
const storageKey = 'SL_pending_v2';
let pending = null;
let lastPayload = null;
let active = false;
let generation = 0;
let nextTimer = null;
let overallTimer = null;
let slowTimer = null;
let cancelRequest = null;
let started = 0;
let metrics = [];
form.action = GAS_URL;
form.method = 'POST';
form.target = 'gasFrame';

function tell(text,error=false) {
  message.textContent = text;
  message.className = error ? 'message error' : 'message sending';
}
function selection(selector) {
  return Array.from(document.querySelectorAll(selector+':checked')).map(x => x.value).join('、');
}
function updateReason() {
  const reason = form.querySelector('input[name="reason"]:checked')?.value || '';
  document.getElementById('healthBox').classList.toggle('hidden',reason !== '病假');
  document.getElementById('otherReasonBox').classList.toggle('hidden',reason !== '其他');
  document.getElementById('otherReason').required = reason === '其他';
  if (reason !== '病假') {
    document.querySelectorAll('.health-checkbox').forEach(x => x.checked = false);
    document.getElementById('healthStatus').value = '';
  }
  if (reason !== '其他') document.getElementById('otherReason').value = '';
}
document.querySelectorAll('input[name="reason"]').forEach(x => x.addEventListener('change',updateReason));

async function payloadHash(d) {
  const bytes = new TextEncoder().encode(JSON.stringify(keys.map(k => d[k])));
  const digest = await crypto.subtle.digest('SHA-256',bytes);
  return Array.from(new Uint8Array(digest),x => x.toString(16).padStart(2,'0')).join('');
}
function remember() {
  // 只保存收件識別碼與摘要，不保存姓名、病況或完整請假內容。
  try { sessionStorage.setItem(storageKey,JSON.stringify(pending)); } catch (_) {}
}
function clearPending() {
  pending = null;
  lastPayload = null;
  try { sessionStorage.removeItem(storageKey); } catch (_) {}
}
function stopChecking() {
  active = false;
  generation++;
  clearTimeout(nextTimer);
  clearTimeout(overallTimer);
  clearTimeout(slowTimer);
  nextTimer = overallTimer = slowTimer = null;
  if (cancelRequest) { cancelRequest(); cancelRequest = null; }
}
function enableRetry() {
  submitBtn.disabled = false;
  submitBtn.textContent = '再次確認上一筆';
}
function showSuccessScreen() {
  const totalMs = Math.round(performance.now()-started);
  stopChecking();
  clearPending();
  form.reset();
  datePicker.clear();
  updateReason();
  document.getElementById('formScreen').classList.add('hidden');
  document.getElementById('successScreen').classList.remove('hidden');
  if (new URLSearchParams(location.search).get('diagnostic') === '1') {
    let box = document.getElementById('JL_diagnostic');
    if (!box) { box = document.createElement('pre'); box.id='JL_diagnostic'; box.style.whiteSpace='pre-wrap'; document.getElementById('successScreen').appendChild(box); }
    box.textContent = JSON.stringify({note:'重新開頁時總時間只計算此次確認',totalMs,checks:metrics},null,2);
  }
  window.scrollTo({top:0,behavior:'smooth'});
}
function backToForm() {
  stopChecking();
  clearPending();
  form.reset();datePicker.clear();updateReason();
  document.getElementById('clientToken').value='';
  document.getElementById('classType').value='';
  document.getElementById('healthStatus').value='';
  message.textContent='';message.className='message';
  submitBtn.disabled=false;submitBtn.textContent='送出請假申請';
  document.getElementById('successScreen').classList.add('hidden');
  document.getElementById('formScreen').classList.remove('hidden');
  window.scrollTo({top:0,behavior:'smooth'});
}
function scheduleCheck(delay=2000) {
  if (!active) return;
  clearTimeout(nextTimer);
  nextTimer = setTimeout(checkWriteStatus,delay);
}
function checkWriteStatus() {
  if (!active || !pending || cancelRequest) return;
  const run = generation;
  const token = pending.token;
  const requestStarted = performance.now();
  const callback = 'JL_callback_'+crypto.randomUUID().replace(/-/g,'');
  const script = document.createElement('script');
  let settled = false;
  let timer;
  function cleanup() {
    clearTimeout(timer);script.remove();
    window[callback]=function() {};
    setTimeout(() => { delete window[callback]; },120000);
    if (cancelRequest === cancel) cancelRequest=null;
  }
  function cancel() { if (!settled) { settled=true;cleanup(); } }
  function finish(result,label) {
    if (settled) return;
    settled=true;cleanup();
    if (!active || generation !== run || pending?.token !== token) return;
    metrics.push({roundTripMs:Math.round(performance.now()-requestStarted),result:label});
    if (result?.done === true && result.success === true) { showSuccessScreen();return; }
    if (result?.done === true && result.success === false) {
      stopChecking();tell(result.message || '請向校方確認原申請。',true);enableRetry();return;
    }
    scheduleCheck();
  }
  cancelRequest=cancel;
  window[callback]=r => finish(r,r?.success ? 'confirmed' : 'pending');
  script.onerror=() => finish(null,'network_error');
  const url=new URL(GAS_URL);
  url.searchParams.set('action','check');url.searchParams.set('clientToken',token);
  url.searchParams.set('payloadHash',pending.hash);url.searchParams.set('callback',callback);
  url.searchParams.set('_',Date.now().toString());
  script.src=url.toString();
  timer=setTimeout(() => finish(null,'query_timeout'),20000);
  document.body.appendChild(script);
}
function startChecking() {
  stopChecking();active=true;started=performance.now();metrics=[];
  submitBtn.disabled=true;submitBtn.textContent='正在確認登記…';
  tell('正在送出並確認登記結果，請稍候，勿重複送出。');
  scheduleCheck();
  slowTimer=setTimeout(() => { if(active) tell('系統仍在確認登記結果，請勿重複填寫。'); },12000);
  overallTimer=setTimeout(() => {
    stopChecking();tell('尚未確認登記結果，資料可能已收到。可按「再次確認上一筆」，緊急請假請直接聯絡校方。',true);enableRetry();
  },60000);
}
form.addEventListener('submit',async function(e) {
  e.preventDefault();
  if (active || submitBtn.disabled) return;
  if (pending) { startChecking();return; } // 未確認前只查詢，不送另一份內容。
  if (datePicker.selectedDates.length === 0) {
    tell('請先選擇至少一天請假日期。',true);datePicker.open();return;
  }
  document.getElementById('classType').value=selection('.class-checkbox');
  document.getElementById('healthStatus').value=selection('.health-checkbox');
  ['studentName','englishName','parentClass','otherReason','note'].forEach(k => { document.getElementById(k).value=document.getElementById(k).value.trim(); });
  if (!form.checkValidity()) { form.reportValidity();return; }
  if (!document.getElementById('classType').value) { tell('請至少選擇一項請假班別。',true);return; }
  if (!/^https:\/\/script\.google\.com\/macros\/s\/[^/]+\/exec$/.test(GAS_URL)) {
    tell('測試網址尚未設定，尚未送出資料。',true);return;
  }
  submitBtn.disabled=true;
  try {
    const data=Object.fromEntries(new FormData(form).entries());
    const dates=data.leaveDate.split('、');
    data.leaveDate=Array.from(new Set(dates)).sort().join('、');
    if (data.reason !== '病假') data.healthStatus='';
    if (data.reason !== '其他') data.otherReason='';
    const token=crypto.randomUUID();
    const hash=await payloadHash(data);
    lastPayload={...data,clientToken:token};
    pending={token,hash,createdAt:Date.now()};remember();
    // 用送出快照建立暫時表單，避免 hash 計算期間修改欄位造成不一致。
    const send=document.createElement('form');send.method='POST';send.action=GAS_URL;send.target='gasFrame';send.hidden=true;
    Object.entries(lastPayload).forEach(([name,value]) => { const input=document.createElement('input');input.type='hidden';input.name=name;input.value=value;send.appendChild(input); });
    document.body.appendChild(send);
    startChecking();
    HTMLFormElement.prototype.submit.call(send);
    send.remove();
  } catch (_) {
    stopChecking();submitBtn.disabled=false;
    tell(pending ? '尚未確認送出結果，請聯絡校方或再次確認上一筆。' : '瀏覽器無法啟動送出，尚未送出資料。請改用 Safari 或 Chrome。',true);
    if (pending) enableRetry();
  }
});
// 讓「再次確認」不被已清空的必填欄位擋住。
submitBtn.addEventListener('click',function(e) {
  if (pending && !active) { e.preventDefault();startChecking(); }
});
try {
  const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');
  if (saved && /^[A-Za-z0-9_-]{12,100}$/.test(saved.token) && /^[a-f0-9]{64}$/.test(saved.hash)) {
    pending=saved;enableRetry();tell('有一筆尚未確認的申請，請按「再次確認上一筆」。');
  }
} catch (_) {}

  </script>
</body>
</html>
